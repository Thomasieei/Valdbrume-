name: Diagnostic des effets
on:
  push:
    branches: [main]
    paths: ['project/diag/**', '.github/workflows/diag.yml', 'project/scripts/thug.gd', 'tools/props.py']
  workflow_dispatch: {}
permissions:
  contents: write
env:
  GODOT_VERSION: 4.7.2
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy trimesh pygltflib meshoptimizer pillow
      - run: python tools/build_project.py
      - id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools > /dev/null
      - run: ~/godot/godot --headless --path project --import 2>&1 | grep -iE "vefects|error" | head -40 || true
      - name: Vérification des scripts
        run: |
          for f in project/scripts/*.gd; do timeout 60 ~/godot/godot --headless --path project --check-only --script "res://scripts/$(basename $f)" 2>&1 | grep -E "SCRIPT ERROR|Parse Error|error\(" | sed "s|^|$(basename $f): |" || true; done
      - name: Effets
        run: |
          mkdir -p captures; timeout 1100 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path project --rendering-method mobile --rendering-driver vulkan --resolution 1280x720 --fixed-fps 60 -- --parcours > captures/log.txt 2>&1 || true
          grep -E "PARCOURS|SCRIPT|ERROR|capture|MOBILIER|ETAPE|COURSE|PK " captures/log.txt | head -150; grep -v "Loading resource\|Completed load\|RGB8\|backtrace\|\[[0-9]\]" captures/log.txt | tail -25
      - name: Publication
        run: |
          cd captures && git init -q && git checkout -q -b diag && git add . && git -c user.name=ci -c user.email=ci@x commit -qm diag
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git diag
