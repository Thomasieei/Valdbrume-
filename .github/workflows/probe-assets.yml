name: Recherche d'assets personnages
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/probe-assets.yml'] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: OpenGameArt (Quaternius)
        run: |
          mkdir -p a && cd a
          for f in universal_animation_librarystandard.zip universal_animation_library_2standard.zip universal_base_charactersstandard.zip universal_base_characters_standard.zip modular_character_outfits_fantasystandard.zip; do
            code=$(curl -sL -o "$f" -w "%{http_code}" "https://opengameart.org/sites/default/files/$f"); echo "$f -> $code $(stat -c%s "$f" 2>/dev/null)"
            if [ "$code" = 200 ] && unzip -tq "$f" >/dev/null 2>&1; then unzip -l "$f" | awk '{print $4}' | grep -vE '/$' | head -80; else rm -f "$f"; fi
          done
      - name: Contenu des bibliothèques d'animation
        run: |
          cd a
          for f in *.zip; do echo "== $f"; zipinfo -1 "$f" | grep -vE '/$' | head -60; done
      - name: Dépôts publics contenant les personnages Quaternius
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for r in stamps9k/milonga-studio tommy-xr/functor vitae0/games prabinpebam/pose-n-composition IdehistorieCases/Cases-GUI BoQsc/quaternius-ragdoll-walkthrough NoLimitNexus/game-models jesta88/marrow aswinkumarks/IONFALL DyingStar-game/DyingStar; do
            echo "== $r"
            gh api "repos/$r/git/trees/HEAD?recursive=1" --jq '.tree[] | select(.type=="blob") | select(.path|test("(?i)superhero|regular_|teen_|hair_|ranger|peasant|ual[12]|universal|base_char|mannequin|quaternius")) | "\(.size) \(.path)"' 2>&1 | head -40
          done
